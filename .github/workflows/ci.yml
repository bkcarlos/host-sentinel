name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - name: Test nftables in isolated network namespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! test -x /usr/sbin/nft; then
            sudo apt-get update
            sudo apt-get install -y nftables
          fi
          sentinel_test_bin=$(cargo test --lib --no-run --locked --message-format=json | python3 -c 'import sys,json; [print(x["executable"]) for line in sys.stdin if (x:=json.loads(line)).get("reason")=="compiler-artifact" and x.get("executable") and x["target"]["name"]=="host_sentinel" and "lib" in x["target"]["kind"]]')
          sudo unshare --net env HOST_SENTINEL_ISOLATED_NFT_TEST=yes "$sentinel_test_bin" response::tests::nft_kernel_schema_and_expiry --ignored --exact
      - run: cargo run --locked -- --config config.example.toml check
