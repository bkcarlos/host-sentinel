# Copy to config.toml. All examples use reserved documentation addresses.
state_dir = "state"
host_label = "my-ubuntu"
sample_seconds = 5
retention_days = 30

[cpu]
high_percent = 85.0
recovery_percent = 65.0
sustained_seconds = 180
baseline_seconds = 300
spike_delta_percent = 40.0
spike_min_percent = 70.0
spike_seconds = 30
cooldown_seconds = 900

[ssh]
# Legacy units remain accepted; evidence collection follows root SSH process names across units.
# Optional root-authored task receipts (monitor reads only).
automation_dir = "/etc/host-sentinel/automation.d"
units = ["ssh.service", "sshd.service"]
failure_count = 10
failure_window_seconds = 300
failure_cooldown_seconds = 900
# Default: every successful login is unknown and generates an alert.
trusted = []

# To trust a specific user, source AND key, remove `trusted = []` above:
# [[ssh.trusted]]
# user = "ubuntu"
# networks = ["192.0.2.10/32", "2001:db8::/64"]
# fingerprints = ["SHA256:REPLACE_WITH_YOUR_PUBLIC_KEY_FINGERPRINT"]
# Fields within a rule are ANDed; separate rules are ORed.
# Omit networks for a known key that roams between IPs (reduced source checking).

[webhook]
enabled = false
url = "http://127.0.0.1:3100/api/v1/bots/REPLACE_BOT_ID/webhook"
token_env = "RAKAZO_WEBHOOK_TOKEN"
timeout_seconds = 10

[mcp]
enabled = false
listen = "127.0.0.1:8787"
token_env = "SENTINEL_MCP_TOKEN"
allowed_hosts = ["localhost", "127.0.0.1", "::1"]

# Optional privileged response. Read deploy/RESPONSE.md before enabling.
# Requires a separate root broker and an exact mandatory client approval rule.
[response]
enabled = false
socket = "/run/host-sentinel-response/control.sock"
state_dir = "/var/lib/host-sentinel-response"
# Set this to: id -u host-sentinel (never root).
# allowed_uid = 999
listen = "127.0.0.1:8788"
token_env = "SENTINEL_RESPONSE_TOKEN"
allowed_hosts = ["localhost", "127.0.0.1", "::1"]
# REQUIRED: replace with the management sources that must never be cut off.
protected_networks = []
protected_users = ["root", "host-sentinel"]
# Explicit ordinary user UIDs allowed for process signals; empty disables real signals.
process_allowed_uids = []
protected_process_names = []
ssh_ports = [22]
max_quarantine_seconds = 3600
proposal_ttl_seconds = 300
